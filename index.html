<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="icon" href="qr.webp">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>Gerador de QR Code</h1>
            <p>Cole uma URL ou digite um texto para criar o código QR</p>
        </header>

        <div class="form">
            <input type="text" placeholder="Digite o texto ou URL">
            <button id="gerar">Gerar QR Code</button>
        </div>

        <div class="qr-code">
            <img src="" alt="qr-code" id="imagemQr">
        </div>

        <div class="acoes">
            <button id="imprimir" class="btn-acao">Imprimir / Salvar PDF</button>
            <button id="baixar" class="btn-acao verde">Baixar PNG</button>
        </div>

        <div class="footer">
            <p>Desenvolvido por | <strong>Bruno Molina</strong> <br>
            © Copyright 2025 — Todos os direitos reservados.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
